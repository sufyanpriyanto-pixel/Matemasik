<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATEMASIK - Matematika Asik</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Fredoka & Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- TailWind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#00a8e8',
                            cyan: '#3a86ff',
                            lightCyan: '#eef7ff',
                            orange: '#ff9f1c',
                            yellow: '#ffbf00',
                            pink: '#ff70a6',
                            lightPink: '#fff0f5',
                            green: '#2ec4b6',
                            softGreen: '#e6fffa'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fffde7 0%, #fff3e0 40%, #fce4ec 100%);
            min-height: 100vh;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        .bg-math-pattern {
            background-image: radial-gradient(#3a86ff 0.75px, transparent 0.75px), radial-gradient(#ff70a6 0.75px, #fffde7 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            opacity: 0.15;
        }

        .dashed-border-amber { border: 2.5px dashed #f59e0b; }
        .dashed-border-pink { border: 3px dashed #f43f5e; }
        .dashed-border-cyan { border: 2px dashed #38bdf8; }

        .numpad-key:active { transform: scale(0.93); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }

        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(5px);
        }

        /* RESPONSIVE MOBILE FIXES (@media max-width: 768px) */
        @media (max-width: 768px) {
            body {
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                overflow-x: hidden !important;
            }

            main.app-container {
                width: 100% !important;
                max-width: 100% !important;
                min-height: 100vh !important;
                border-radius: 0 !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 1.25rem 0.875rem !important;
            }

            /* Stack all Multi-column Grids into 1 Column on Mobile */
            .mobile-stack-grid {
                grid-template-columns: 1fr !important;
            }

            /* Keep numpad touchable 5-cols grid */
            .numpad-grid-cols {
                grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
            }

            /* Responsive Top Header Bar */
            .responsive-header {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 0.75rem !important;
            }

            .header-user-badge {
                width: 100% !important;
                justify-content: center !important;
            }

            .header-actions-group {
                width: 100% !important;
                display: flex !important;
                justify-content: space-between !important;
                gap: 0.5rem !important;
            }

            .header-actions-group button {
                flex: 1 !important;
                justify-content: center !important;
            }

            /* Touch-friendly buttons and inputs */
            button, input, select {
                min-height: 46px !important;
                font-size: 0.95rem !important;
            }

            .numpad-key {
                min-height: 54px !important;
                font-size: 1.35rem !important;
            }

            /* Modal optimization for mobile */
            .responsive-modal-card {
                width: 100% !important;
                max-width: 100% !important;
                height: 100% !important;
                max-height: 100vh !important;
                border-radius: 0 !important;
                border: none !important;
            }
        }

        /* SVG & Graphic Animations */
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        @keyframes pencilWiggle {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(-6deg) translateY(-2px); }
            75% { transform: rotate(5deg) translateY(1px); }
        }

        @keyframes starTwinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.35) rotate(180deg); opacity: 0.75; }
        }

        @keyframes eyeBlink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        @keyframes symbolBob1 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(-6deg); }
        }

        @keyframes symbolBob2 {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(5px) rotate(8deg); }
        }

        .anim-logo-float { animation: logoFloat 4.2s ease-in-out infinite; }
        .anim-pencil { animation: pencilWiggle 3.2s ease-in-out infinite; transform-origin: 105px 230px; }
        .anim-star { animation: starTwinkle 2.8s ease-in-out infinite; transform-origin: 256px 65px; }
        .anim-eye { animation: eyeBlink 4s ease-in-out infinite; transform-origin: 320px 110px; }
        .anim-bob-1 { animation: symbolBob1 3.5s ease-in-out infinite; transform-origin: center; }
        .anim-bob-2 { animation: symbolBob2 4s ease-in-out infinite; transform-origin: center; }

        @keyframes marqueeSeamless {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .anim-marquee-seamless {
            display: flex;
            width: max-content;
            animation: marqueeSeamless 12s linear infinite;
        }
        .anim
